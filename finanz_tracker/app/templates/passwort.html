{% extends "base.html" %}{% from "_makros.html" import csrf with context %}
{% block titel %}Passwort ändern{% endblock %}
{% block inhalt %}
<div class="auth" style="margin-top:2vh">
  <form method="post" class="karte">
    {{ csrf() }}
    <h1>Passwort ändern</h1>
    {% if fehler %}<div class="flash warn">{{ fehler }}</div>{% endif %}
    <label class="feld">Bisheriges Passwort<input type="password" name="alt" required autocomplete="current-password"></label>
    <label class="feld">Neues Passwort (mindestens 8 Zeichen)<input type="password" name="neu" required minlength="8" autocomplete="new-password"></label>
    <label class="feld">Neues Passwort wiederholen<input type="password" name="neu2" required minlength="8" autocomplete="new-password"></label>
    <button class="btn primaer" type="submit">Speichern</button>
  </form>
</div>
{% endblock %}

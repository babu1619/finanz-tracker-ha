name: Finanz-Tracker
version: "0.2.2"
slug: finanz_tracker
description: Haushaltsbuch für die Familie – Import, Kategorien, Budgets, Sparziele, Darlehen; als App installierbar
url: https://github.com/DEIN-GITHUB-NAME/finanz-tracker
arch:
  - aarch64
  - amd64
# Optional vorgebaute Images (siehe README, Abschnitt „Werkzeuge“): Zeile einschalten
# image: "ghcr.io/DEIN-GITHUB-NAME/finanz-tracker-{arch}"
init: false
startup: application
boot: auto
hassio_api: true
map:
  - ssl
ports:
  8080/tcp: 8099
ports_description:
  8080/tcp: Weboberfläche des Finanz-Trackers (HTTPS)
webui: "[PROTO:https]://[HOST]:[PORT:8080]"
options:
  https: true
  zertifikat: eigenes
  zusatz_hostnamen: ""
schema:
  https: bool
  zertifikat: list(eigenes|homeassistant)
  zusatz_hostnamen: str?
  certfile: str?
  keyfile: str?
  admin_passwort_reset: password?
